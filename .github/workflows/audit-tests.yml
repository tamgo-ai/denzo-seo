name: Platform reliability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DENZO_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - run: python -m compileall -q denzo
      - run: python -m ruff check denzo --select F821
      - run: python -m pytest tests -q
      - name: Validate WordPress connector
        run: |
          php -l integrations/wordpress/denzo-seo/denzo-seo.php
          php tests/wordpress_connector_contract.php
